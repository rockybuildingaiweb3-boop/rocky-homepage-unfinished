<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" fill="none">
  <defs>
    <!-- Soft celestial starlight neon glow filter -->
    <filter id="rocky-glow" x="-25%" y="-35%" width="150%" height="170%">
      <!-- Wide diffuse aura -->
      <feGaussianBlur stdDeviation="7" result="coloredBlur1"/>
      <feFlood flood-color="rgba(199, 210, 254, 0.75)" result="color1"/>
      <feComposite in="color1" in2="coloredBlur1" operator="in" result="softGlow"/>
      
      <!-- Medium violet glow -->
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur2"/>
      <feFlood flood-color="rgba(224, 210, 255, 0.9)" result="color2"/>
      <feComposite in="color2" in2="coloredBlur2" operator="in" result="coreGlow"/>

      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="coreGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Alex+Brush&amp;display=swap');
      .sign-text {
        font-family: 'Alex Brush', 'Great Vibes', cursive;
        font-size: 168px;
        font-weight: 400;
        fill: #ffffff;
        stroke: #ffffff;
        stroke-width: 1.2px;
        filter: url(#rocky-glow);
        letter-spacing: 0.02em;
      }
      .sign-flourish {
        stroke: #ffffff;
        stroke-width: 2.2px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        filter: url(#rocky-glow);
      }
    </style>
  </defs>

  <!-- Flowing signature text with glowing starlight treatment -->
  <g transform="translate(60, 220) rotate(-2)">
    <text x="0" y="0" class="sign-text">Rocky Babcock</text>
    <!-- Extended soaring tail flourish from the final 'k' -->
    <path class="sign-flourish" d="M 870, -12 C 920, 2 980, -6 1040, -18 C 1070, -24 1100, -28 1120, -27"/>
  </g>
</svg>