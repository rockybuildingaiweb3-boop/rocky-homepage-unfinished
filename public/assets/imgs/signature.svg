<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 360" fill="none" class="rocky-signature-svg">
  <defs>
    <!-- Powerful multi-layer electric starlight glow -->
    <filter id="super-radiant-glow" x="-30%" y="-50%" width="160%" height="200%">
      <!-- Wide ethereal ambient purple halo -->
      <feGaussianBlur stdDeviation="16" result="blurDeep"/>
      <feFlood flood-color="rgba(168, 85, 247, 0.75)" result="colorDeep"/>
      <feComposite in="colorDeep" in2="blurDeep" operator="in" result="glowDeep"/>

      <!-- Medium celestial cyan-indigo starlight aura -->
      <feGaussianBlur stdDeviation="7" result="blurMid"/>
      <feFlood flood-color="rgba(199, 210, 254, 0.95)" result="colorMid"/>
      <feComposite in="colorMid" in2="blurMid" operator="in" result="glowMid"/>

      <!-- Intense near-core electric violet glow -->
      <feGaussianBlur stdDeviation="3" result="blurTight"/>
      <feFlood flood-color="rgba(245, 243, 255, 1.0)" result="colorTight"/>
      <feComposite in="colorTight" in2="blurTight" operator="in" result="glowTight"/>

      <!-- High contrast deep drop shadow for separation against bright nebula/watercolor background -->
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0, 0, 0, 0.95)"/>

      <feMerge>
        <feMergeNode in="glowDeep"/>
        <feMergeNode in="glowMid"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="radiant-core-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5f3ff"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- 1. DEEP BLOOM UNDERLAYER (Heavy, saturated stroke providing massive radiance) -->
  <g opacity="0.9" filter="url(#super-radiant-glow)">
    <!-- Word 1: Rocky -->
    <!-- R initial flourish and ascender loop -->
    <path stroke="url(#radiant-core-grad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"
      d="M 65 190 C 75 140, 115 75, 160 70 C 190 66, 215 88, 205 125 C 195 160, 155 190, 130 195 C 115 198, 105 185, 110 160 L 140 75" />
    
    <!-- R leg and connection into 'o' -->
    <path stroke="url(#radiant-core-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"
      d="M 152 142 C 172 145, 195 165, 205 195 C 210 208, 222 210, 235 195" />

    <!-- 'o' loop -->
    <path stroke="url(#radiant-core-grad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"
      d="M 235 195 C 248 175, 275 170, 285 190 C 292 205, 280 215, 265 215 C 250 215, 242 205, 252 192 C 262 180, 280 185, 298 195" />

    <!-- 'c' curve -->
    <path stroke="url(#radiant-core-grad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"
      d="M 312 188 C 305 182, 295 188, 298 200 C 302 212, 318 214, 332 204" />

    <!-- 'k' ascender loop & leg -->
    <path stroke="url(#radiant-core-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"
      d="M 332 204 C 345 185, 365 110, 375 105 C 382 102, 385 112, 375 145 L 360 212 M 365 188 C 380 182, 395 192, 390 205 C 388 210, 395 212, 405 204" />

    <!-- 'y' descent and fluid underline loop -->
    <path stroke="url(#radiant-core-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"
      d="M 405 204 C 412 190, 424 186, 432 198 L 436 210 C 445 192, 458 188, 466 200 L 468 215 C 465 240, 450 290, 430 305 C 412 318, 395 305, 412 280 C 428 255, 470 220, 510 195" />

    <!-- Word 2: Babcock -->
    <!-- 'B' tall ascender and double lobe -->
    <path stroke="url(#radiant-core-grad)" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"
      d="M 525 215 L 565 65 C 570 48, 555 52, 542 75 L 520 160 C 520 160, 545 125, 580 120 C 610 115, 625 135, 612 165 C 600 188, 570 195, 545 192 C 575 190, 620 188, 628 220 C 634 245, 610 262, 575 260 C 535 258, 510 240, 528 210" />

    <!-- 'a' loop -->
    <path stroke="url(#radiant-core-grad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"
      d="M 635 212 C 648 190, 672 188, 680 205 C 685 218, 675 228, 660 228 C 646 228, 640 216, 650 202 C 660 190, 678 195, 688 226" />

    <!-- 'b' ascender loop -->
    <path stroke="url(#radiant-core-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"
      d="M 688 226 C 700 205, 725 115, 735 110 C 742 106, 745 118, 735 150 L 725 220 C 730 228, 745 226, 755 212" />

    <!-- 'c' curve -->
    <path stroke="url(#radiant-core-grad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"
      d="M 770 200 C 762 194, 752 200, 756 214 C 760 225, 776 226, 790 216" />

    <!-- 'o' loop -->
    <path stroke="url(#radiant-core-grad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"
      d="M 802 206 C 812 192, 830 190, 836 205 C 840 216, 832 225, 820 225 C 808 225, 802 216, 810 204 C 818 194, 832 198, 846 208" />

    <!-- 'c' curve -->
    <path stroke="url(#radiant-core-grad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"
      d="M 865 200 C 858 194, 848 200, 852 214 C 856 225, 872 226, 886 216" />

    <!-- 'k' and extended soaring starlight tail flourish -->
    <path stroke="url(#radiant-core-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"
      d="M 886 216 C 896 195, 915 125, 924 120 C 930 116, 932 125, 924 155 L 912 218 M 918 196 C 930 190, 942 198, 938 210 C 935 218, 946 218, 960 208 C 995 188, 1045 178, 1100 174" />
  </g>

  <!-- 2. PURE BRILLIANT WHITE ULTRA-SHARP CORE (Crisp laser-sharp foreground stroke) -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Word 1: Rocky -->
    <path stroke-width="2.6" d="M 65 190 C 75 140, 115 75, 160 70 C 190 66, 215 88, 205 125 C 195 160, 155 190, 130 195 C 115 198, 105 185, 110 160 L 140 75" />
    <path stroke-width="2.2" d="M 152 142 C 172 145, 195 165, 205 195 C 210 208, 222 210, 235 195" />
    <path stroke-width="2.0" d="M 235 195 C 248 175, 275 170, 285 190 C 292 205, 280 215, 265 215 C 250 215, 242 205, 252 192 C 262 180, 280 185, 298 195" />
    <path stroke-width="2.0" d="M 312 188 C 305 182, 295 188, 298 200 C 302 212, 318 214, 332 204" />
    <path stroke-width="2.2" d="M 332 204 C 345 185, 365 110, 375 105 C 382 102, 385 112, 375 145 L 360 212 M 365 188 C 380 182, 395 192, 390 205 C 388 210, 395 212, 405 204" />
    <path stroke-width="2.2" d="M 405 204 C 412 190, 424 186, 432 198 L 436 210 C 445 192, 458 188, 466 200 L 468 215 C 465 240, 450 290, 430 305 C 412 318, 395 305, 412 280 C 428 255, 470 220, 510 195" />

    <!-- Word 2: Babcock -->
    <path stroke-width="2.8" d="M 525 215 L 565 65 C 570 48, 555 52, 542 75 L 520 160 C 520 160, 545 125, 580 120 C 610 115, 625 135, 612 165 C 600 188, 570 195, 545 192 C 575 190, 620 188, 628 220 C 634 245, 610 262, 575 260 C 535 258, 510 240, 528 210" />
    <path stroke-width="2.0" d="M 635 212 C 648 190, 672 188, 680 205 C 685 218, 675 228, 660 228 C 646 228, 640 216, 650 202 C 660 190, 678 195, 688 226" />
    <path stroke-width="2.2" d="M 688 226 C 700 205, 725 115, 735 110 C 742 106, 745 118, 735 150 L 725 220 C 730 228, 745 226, 755 212" />
    <path stroke-width="2.0" d="M 770 200 C 762 194, 752 200, 756 214 C 760 225, 776 226, 790 216" />
    <path stroke-width="2.0" d="M 802 206 C 812 192, 830 190, 836 205 C 840 216, 832 225, 820 225 C 808 225, 802 216, 810 204 C 818 194, 832 198, 846 208" />
    <path stroke-width="2.0" d="M 865 200 C 858 194, 848 200, 852 214 C 856 225, 872 226, 886 216" />
    <path stroke-width="2.2" d="M 886 216 C 896 195, 915 125, 924 120 C 930 116, 932 125, 924 155 L 912 218 M 918 196 C 930 190, 942 198, 938 210 C 935 218, 946 218, 960 208 C 995 188, 1045 178, 1100 174" />
  </g>

  <!-- Specular Starlight Glint Stars -->
  <!-- Glint on R peak -->
  <g transform="translate(160, 68) scale(0.65)">
    <path fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 16px #a855f7)" d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z"/>
  </g>
  <!-- Glint on B loop -->
  <g transform="translate(615, 128) scale(0.55)">
    <path fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 14px #38bdf8)" d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z"/>
  </g>
  <!-- Glint on tail tip -->
  <g transform="translate(1095, 174) scale(0.6)">
    <path fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 18px #c084fc)" d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z"/>
  </g>
</svg>